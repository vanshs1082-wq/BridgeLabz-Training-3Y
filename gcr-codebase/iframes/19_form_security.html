<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>
    <h1>Secure Form</h1>

    <form autocomplete="off">
        <label>Username:</label><br>
        <input type="text" required><br><br>

        <label>Password:</label><br>
        <input type="password" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <p>Turning off autocomplete can improve security by preventing the browser from automatically filling saved sensitive information on shared devices.</p>
</body>
</html>
