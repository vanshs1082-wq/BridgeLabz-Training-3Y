<!DOCTYPE html>
<html>
<head>
    <!-- Sets the title shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding used by the webpage. -->
    <meta charset="UTF-8">

    <!-- Gives a short description of the webpage. -->
    <meta name="description" content="A webpage showing important head elements.">

    <!-- Specifies the author of the webpage. -->
    <meta name="author" content="Vansh Sharma">

    <!-- Sets a base URL for relative links. -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- Contains CSS styling. -->
    <style>
    </style>

    <!-- Contains JavaScript code. -->
    <script>
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page contains important HTML head elements.</p>
</body>
</html>
