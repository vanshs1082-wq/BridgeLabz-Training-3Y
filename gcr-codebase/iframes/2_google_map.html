<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>
    <h1>My City Map</h1>

    <!-- loading="lazy" loads the map only when it is needed, helping the page load faster. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,India&output=embed"
        title="Map of Mathura"
        width="100%"
        height="500"
        loading="lazy">
    </iframe>
</body>
</html>
