<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>
<h1>Course Registration</h1>

<form>
    <fieldset>
        <legend>Student Details</legend>

        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Select Course:</label>
        <select name="course">
            <option>Java</option>
            <option>Python</option>
            <option>Web Development</option>
            <option>Database</option>
        </select><br><br>

        <input type="submit" value="Register">
    </fieldset>
</form>

<h2>Course Schedules</h2>
<table border="1">
    <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Instructor</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>10:00 AM</td>
        <td>Mr. Sharma</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td>11:00 AM</td>
        <td>Ms. Priya</td>
    </tr>
    <tr>
        <td>Friday</td>
        <td>2:00 PM</td>
        <td>Mr. Kumar</td>
    </tr>
</table>
</body>
</html>
