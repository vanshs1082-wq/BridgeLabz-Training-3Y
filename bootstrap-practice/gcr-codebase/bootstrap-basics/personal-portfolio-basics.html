<!DOCTYPE html>
<html>
<head>
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">
    <header class="text-center p-5 bg-white">
        <h1 class="fw-bold">Vansh Sharma</h1>
        <p class="lead">Computer Science Student & Developer</p>
    </header>

    <main class="container text-center mt-4">
        <img src="https://picsum.photos/id/1005/200/200" class="img-fluid rounded-circle" alt="Profile">

        <p class="mt-4">I enjoy building websites and learning new technologies.</p>

        <div class="mb-3">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-outline-dark">Download CV</button>
        </div>

        <section class="bg-white p-5 mt-4">
            <h2 class="mb-3">Contact Me</h2>
            <!-- form-control gives the input Bootstrap styling -->
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" placeholder="Your Message"></textarea>
            <button class="btn btn-dark">Send Message</button>
        </section>
    </main>
</body>
</html>
