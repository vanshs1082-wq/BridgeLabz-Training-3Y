<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>
    <header class="bg-dark text-white text-center p-4">
        <h1>Tech Store</h1>
        <p class="mb-0">Products for everyday technology needs</p>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <!-- shadow-sm gives a small card shadow -->
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/id/0/400/250" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5>Laptop</h5>
                        <p>₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/id/96/400/250" class="card-img-top" alt="Keyboard">
                    <div class="card-body">
                        <h5>Keyboard</h5>
                        <p>₹2,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/id/180/400/250" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5>Headphones</h5>
                        <p>₹3,200</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/id/367/400/250" class="card-img-top" alt="Camera">
                    <div class="card-body">
                        <h5>Camera</h5>
                        <p>₹42,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
