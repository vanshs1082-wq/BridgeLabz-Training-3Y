<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body>
    <main class="container py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Task Tracker</h1>
            <!-- badge shows the pending task count -->
            <span class="badge bg-danger">4 Pending</span>
        </header>

        <section>
            <div class="list-group">
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Finish assignment
                    <span class="badge bg-danger">High</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Read Bootstrap notes
                    <span class="badge bg-warning text-dark">Medium</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Practice CSS
                    <span class="badge bg-success">Low</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Update portfolio
                    <span class="badge bg-danger">High</span>
                </div>
            </div>
        </section>

        <button class="btn btn-success mt-4">
            Completed <span class="badge bg-light text-dark">2</span>
        </button>
    </main>
</body>
</html>
