<!DOCTYPE html>
<html>
<head>
    <title>Today's Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="restaurant-menu-page.css">
</head>
<body>
    <header class="text-center py-5 bg-light">
        <h1>Spice Garden</h1>
        <p class="lead">Today's Menu</p>
    </header>

    <main class="container py-5">
        <section class="row">
            <div class="col-md-8">
                <!-- Bootstrap table makes menu information easy to read -->
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Dish</th>
                            <th>Category</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Paneer Tikka</td><td>Starter</td><td>₹220</td></tr>
                        <tr><td>Butter Naan</td><td>Main Course</td><td>₹80</td></tr>
                        <tr><td>Dal Makhani</td><td>Main Course</td><td>₹180</td></tr>
                        <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹100</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="col-md-4">
                <h2>Chef's Specials</h2>
                <!-- list-group creates a Bootstrap styled list -->
                <ul class="list-group mb-4">
                    <li class="list-group-item">Special Paneer Curry</li>
                    <li class="list-group-item">Tandoori Platter</li>
                    <li class="list-group-item">Mango Lassi</li>
                </ul>
            </div>
        </section>

        <section class="text-center mt-4">
            <img src="https://picsum.photos/id/292/700/350" class="img-fluid rounded" alt="Food">
            <p class="mt-2">Fresh food prepared by our kitchen every day.</p>
        </section>
    </main>
</body>
</html>
