<!DOCTYPE html>
<html>
<head>
    <title>Explore World Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="travel-agency-showcase.css">
</head>
<body>
    <header class="bg-dark text-white text-center py-4">
        <h1>Explore World</h1>
        <p class="mb-0">Your next adventure starts here</p>
    </header>

    <main>
        <section class="container py-4">
            <!-- Bootstrap carousel creates the destination slideshow -->
            <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="3000">
                        <img src="https://picsum.photos/id/1036/1200/500" class="d-block w-100" alt="Beach">
                        <div class="carousel-caption">
                            <h2>Bali</h2>
                            <p>Relax beside beautiful beaches.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="4000">
                        <img src="https://picsum.photos/id/1018/1200/500" class="d-block w-100" alt="Mountain">
                        <div class="carousel-caption">
                            <h2>Switzerland</h2>
                            <p>Explore mountains and peaceful valleys.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="5000">
                        <img src="https://picsum.photos/id/1043/1200/500" class="d-block w-100" alt="Travel">
                        <div class="carousel-caption">
                            <h2>New Zealand</h2>
                            <p>Discover amazing natural landscapes.</p>
                        </div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <section class="container py-4">
            <h2>Booking Progress</h2>
            <div class="progress">
                <!-- progress-bar shows 70 percent completion -->
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%;">
                    70%
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-4">
        <p class="mb-0">Contact: travel@example.com | +91 98765 43210</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
