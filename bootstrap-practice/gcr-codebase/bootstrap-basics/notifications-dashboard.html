<!DOCTYPE html>
<html>
<head>
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="notifications-dashboard.css">
</head>
<body>
    <main class="container py-5">
        <div class="card">
            <div class="card-header">
                <h1 class="h3 mb-0">Notifications</h1>
            </div>

            <div class="card-body">
                <!-- alert classes show different notification types -->
                <div class="alert alert-success">You received a new message.</div>
                <div class="alert alert-info">Your profile is 80% complete.</div>
                <div class="alert alert-danger">Your password will expire soon.</div>

                <div class="alert alert-warning alert-dismissible fade show">
                    Please verify your email address.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <section class="summary bg-light border p-4 mt-4">
                    <h2 class="h4">Summary</h2>
                    <p class="mb-0">You have 3 new notifications and 1 pending action.</p>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
