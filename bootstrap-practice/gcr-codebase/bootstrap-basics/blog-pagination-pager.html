<!DOCTYPE html>
<html>
<head>
    <title>Blog Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="blog-pagination-pager.css">
</head>
<body>
    <main class="container py-5">
        <h1 class="text-center mb-5">My Blog</h1>

        <article class="mb-4">
            <h2>Learning Bootstrap</h2>
            <p>Bootstrap provides useful classes for creating responsive websites quickly.</p>
        </article>

        <article class="mb-5">
            <h2>Building Better Websites</h2>
            <p>Good spacing, clear typography and responsive layouts make websites easier to use.</p>
        </article>

        <!-- pagination provides page navigation -->
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>

        <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-outline-secondary">Older Posts</button>
            <button class="btn btn-outline-secondary">Newer Posts</button>
        </div>
    </main>
</body>
</html>
