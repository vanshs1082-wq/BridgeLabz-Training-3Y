<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="05_advanced_selectors.css">
</head>
<body>
<header>
    <h1>Advanced CSS Selectors</h1>
</header>

<main>
    <section class="list-section">
        <h2>Items</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Java</li>
            <li>Python</li>
        </ul>
    </section>

    <section>
        <h2>Form</h2>
        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter email">
        <br><br>
        <a href="https://example.com">Secure Link</a>
        <br>
        <a href="http://example.com">Normal Link</a>
    </section>

    <section class="combinators">
        <h2>Combinators</h2>
        <div>
            <p>Paragraph inside div.</p>
            <span>Span inside div.</span>
        </div>
        <p>Paragraph after div.</p>
        <p>Another paragraph.</p>
    </section>
</main>
</body>
</html>
