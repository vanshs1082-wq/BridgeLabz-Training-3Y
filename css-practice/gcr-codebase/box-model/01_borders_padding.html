<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="01_borders_padding.css">
</head>
<body>
<header>
    <h1>Borders and Padding</h1>
</header>

<main>
    <section class="boxes">
        <div class="box solid">
            <h2>Solid</h2>
            <p>Solid border</p>
        </div>
        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Dashed border</p>
        </div>
        <div class="box double">
            <h2>Double</h2>
            <p>Double border</p>
        </div>
        <div class="box groove">
            <h2>Groove</h2>
            <p>Groove border</p>
        </div>
        <div class="box rounded">
            <h2>Rounded</h2>
            <p>Rounded corners</p>
        </div>
    </section>
</main>

<footer>
    <p>Border demonstration page</p>
</footer>
</body>
</html>
