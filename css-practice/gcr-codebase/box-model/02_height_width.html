<!DOCTYPE html>
<html>
<head>
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="02_height_width.css">
</head>
<body>
<header>
    <h1>Height and Width Practice</h1>
</header>

<main>
    <section class="container">
        <div class="box one">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box two">
            <h2>Box 2</h2>
            <p>Width: 30%</p>
            <p>Height: 20vh</p>
        </div>

        <div class="box three">
            <h2>Box 3</h2>
            <p>Width: 15em</p>
            <p>Min and max sizes</p>
        </div>
    </section>
</main>
</body>
</html>
