<!DOCTYPE html>
<html>
<head>
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="06_transformations.css">
</head>
<body>
<header>
    <h1>CSS Transformations</h1>
</header>

<main class="showcase">
    <section>
        <div class="box rotate">Rotate</div>
        <p>rotate()</p>
    </section>

    <section>
        <div class="box scale">Scale</div>
        <p>scale()</p>
    </section>

    <section>
        <div class="box translate">Translate</div>
        <p>translate()</p>
    </section>

    <section>
        <div class="box skew">Skew</div>
        <p>skew()</p>
    </section>
</main>
</body>
</html>
