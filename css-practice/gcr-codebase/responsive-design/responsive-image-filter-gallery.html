<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main class="gallery">
        <div class="image-box">
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <p>Blur</p>
        </div>

        <div class="image-box">
            <img class="gray" src="https://picsum.photos/id/1016/400/300" alt="Nature">
            <p>Grayscale</p>
        </div>

        <div class="image-box">
            <img class="sepia" src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <p>Sepia</p>
        </div>

        <div class="image-box">
            <img class="bright" src="https://picsum.photos/id/1024/400/300" alt="Animal">
            <p>Brightness</p>
        </div>

        <div class="image-box">
            <img class="contrast" src="https://picsum.photos/id/1035/400/300" alt="Forest">
            <p>Contrast</p>
        </div>

        <div class="image-box">
            <img class="hue" src="https://picsum.photos/id/1040/400/300" alt="Building">
            <p>Hue Rotate</p>
        </div>
    </main>
</body>
</html>
