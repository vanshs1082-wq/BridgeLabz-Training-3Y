<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>
    <link rel="stylesheet" href="responsive-dashboard-summary.css">
</head>
<body>
    <main class="dashboard">
        <header>
            <h1>CSS Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>
            <p>Home</p>
            <p>Topics</p>
            <p>About</p>
        </aside>

        <section class="cards">
            <div class="card">
                <h2>Filters</h2>
                <p>CSS filters change how an element looks.</p>
            </div>

            <div class="card">
                <h2>Typography</h2>
                <p>Responsive text can use relative units.</p>
            </div>

            <div class="card">
                <h2>Media Queries</h2>
                <p>Media queries change styles for different screens.</p>
            </div>

            <div class="card">
                <h2>Cheat Sheet</h2>
                <p>Useful responsive CSS examples.</p>
            </div>
        </section>
    </main>
</body>
</html>
