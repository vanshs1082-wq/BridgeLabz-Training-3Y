<!DOCTYPE html>
<html>
<head>
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="10_mini_ui.css">
</head>
<body>
<header>
    <h1>My Mini UI</h1>
</header>

<main>
    <section class="card">
        <img src="https://via.placeholder.com/180" alt="Profile image">

        <div class="content">
            <h2>Contact Us</h2>
            <form>
                <input type="text" placeholder="Your name">
                <input type="email" placeholder="Your email">
                <textarea placeholder="Your message"></textarea>
                <div class="buttons">
                    <button type="submit">Send</button>
                    <button type="reset">Clear</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 Mini UI</p>
</footer>
</body>
</html>
