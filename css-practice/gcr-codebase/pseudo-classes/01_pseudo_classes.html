<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="01_pseudo_classes.css">
</head>
<body>
<header><h1>Pseudo-Classes</h1></header>
<main>
    <section class="examples">
        <div>
            <a href="#">Hover over this link</a>
            <p>:hover changes the link when the mouse is over it.</p>
        </div>
        <div>
            <button>Click this button</button>
            <p>:active changes the button while it is being clicked.</p>
        </div>
        <div>
            <input type="text" placeholder="Click here">
            <p>:focus changes an input when it is selected.</p>
        </div>
        <div>
            <ul>
                <li>First item</li>
                <li>Second item</li>
                <li>Third item</li>
            </ul>
            <p>:nth-child() selects an item by its position.</p>
        </div>
    </section>
</main>
</body>
</html>
