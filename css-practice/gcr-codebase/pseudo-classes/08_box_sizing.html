<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="08_box_sizing.css">
</head>
<body>
<header><h1>Box-Sizing Comparison</h1></header>
<main>
    <section class="boxes">
        <div class="box default">
            <h2>Default</h2>
            <p>content-box</p>
            <p>Width does not include padding and border.</p>
        </div>
        <div class="box border">
            <h2>Border Box</h2>
            <p>border-box</p>
            <p>Width includes padding and border.</p>
        </div>
    </section>
</main>
</body>
</html>
