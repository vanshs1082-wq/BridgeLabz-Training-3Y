<!DOCTYPE html>
<html>
<head>
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="02_tooltip.css">
</head>
<body>
<header><h1>CSS Tooltips</h1></header>
<main>
    <section class="items">
        <div class="item">Home<span class="tooltip">Go to home</span></div>
        <div class="item">Help<span class="tooltip">Get help here</span></div>
        <div class="item">Profile<span class="tooltip">View your profile</span></div>
        <div class="item">Settings<span class="tooltip">Open settings</span></div>
    </section>
</main>
</body>
</html>
