    <figure><div><img src="https://via.placeholder.com/500x300?text=City" alt="City"></div><figcaption>City</figcaption></figure>
    <figure><div><img src="https://via.placeholder.com/500x300?text=Desert" alt="Desert"></div><figcaption>Desert</figcaption></figure>
    <figure><div><img src="https://via.placeholder.com/500x300?text=Lake" alt="Lake"></div><figcaption>Lake</figcaption></figure>
</main>
</body>
</html>
