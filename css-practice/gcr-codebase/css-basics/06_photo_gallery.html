<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            padding: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .photo {
            position: relative;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: 0.3s;
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            opacity: 0;
            transition: 0.3s;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery">

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=Mountain" alt="Mountain">
        <div class="caption">Mountain</div>
    </div>

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=Beach" alt="Beach">
        <div class="caption">Beach</div>
    </div>

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=Forest" alt="Forest">
        <div class="caption">Forest</div>
    </div>

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=City" alt="City">
        <div class="caption">City</div>
    </div>

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=Desert" alt="Desert">
        <div class="caption">Desert</div>
    </div>

    <div class="photo">
        <img src="https://via.placeholder.com/500x300?text=Lake" alt="Lake">
        <div class="caption">Lake</div>
    </div>

</div>

</body>
</html>
