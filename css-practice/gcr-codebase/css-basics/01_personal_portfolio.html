<!DOCTYPE html>
<html>
<head>
    <title>Personal Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f2f5f9;
            color: #17202a;
            font-family: Arial, sans-serif;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: #102a43;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        main {
            flex: 1;
            margin-top: 70px;
            padding: 5vh 8%;
        }

        .intro {
            width: 80%;
            font-size: 1.1em;
        }

        .intro img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin-top: 20px;
        }

        footer {
            background-color: #102a43;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 16px;
        }

        .about {
            margin-top: 30px;
            padding: 2rem;
            border: 2px solid #bcccdc;
        }
    </style>
</head>
<body>

<header>
    <h1>Vansh</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="intro">
        <h2>Welcome to My Portfolio</h2>
        <p>I am a student interested in programming, web development and learning new technologies.</p>
        <img src="https://via.placeholder.com/200" alt="Profile Image">
    </section>

    <section class="about">
        <h2>About Me</h2>
        <p>I enjoy building simple projects and improving my programming skills.</p>
    </section>
</main>

<footer>
    <p>© 2026 Vansh</p>
</footer>

</body>
</html>
