<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr;
            gap: 15px;
            min-height: 100vh;
        }

        header {
            grid-column: 1 / 3;
            background-color: #17324d;
            color: white;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        aside {
            background-color: #dceaf7;
            padding: 20px;
        }

        aside a {
            display: block;
            margin: 20px 0;
            text-decoration: none;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .box {
            padding: 30px;
            background-color: #f1f5f8;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px #aaa;
        }

        .wide {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }

            header {
                grid-column: 1;
            }

            main {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <header>
        <h1>Dashboard</h1>
    </header>

    <aside>
        <h2>Menu</h2>
        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </aside>

    <main>
        <div class="box wide">
            <h2>Overview</h2>
            <p>This box spans two columns.</p>
        </div>

        <div class="box">
            <h2>Users</h2>
            <p>120 Users</p>
        </div>

        <div class="box">
            <h2>Orders</h2>
            <p>75 Orders</p>
        </div>
    </main>

</div>

</body>
</html>
