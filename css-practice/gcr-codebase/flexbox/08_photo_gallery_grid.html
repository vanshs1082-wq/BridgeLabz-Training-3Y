<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        figure {
            margin: 0;
            overflow: hidden;
            background-color: white;
            border: 1px solid #ccc;
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery">

    <figure>
        <img src="https://via.placeholder.com/500x300?text=Mountain" alt="Mountain">
        <figcaption>Mountain</figcaption>
    </figure>

    <figure>
        <img src="https://via.placeholder.com/500x300?text=Beach" alt="Beach">
        <figcaption>Beach</figcaption>
    </figure>

    <figure>
        <img src="https://via.placeholder.com/500x300?text=Forest" alt="Forest">
        <figcaption>Forest</figcaption>
    </figure>

    <figure>
        <img src="https://via.placeholder.com/500x300?text=City" alt="City">
        <figcaption>City</figcaption>
    </figure>

    <figure>
        <img src="https://via.placeholder.com/500x300?text=Desert" alt="Desert">
        <figcaption>Desert</figcaption>
    </figure>

    <figure>
        <img src="https://via.placeholder.com/500x300?text=Lake" alt="Lake">
        <figcaption>Lake</figcaption>
    </figure>

</div>

</body>
</html>
