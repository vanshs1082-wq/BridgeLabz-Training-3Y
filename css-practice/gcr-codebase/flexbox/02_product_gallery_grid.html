<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            min-height: 180px;
            padding: 25px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Products</h1>

<div class="products">
    <div class="card"><h2>Laptop</h2><p>₹50000</p></div>
    <div class="card"><h2>Phone</h2><p>₹25000</p></div>
    <div class="card"><h2>Headphones</h2><p>₹2000</p></div>
    <div class="card"><h2>Keyboard</h2><p>₹1500</p></div>
    <div class="card"><h2>Mouse</h2><p>₹800</p></div>
    <div class="card"><h2>Monitor</h2><p>₹12000</p></div>
    <div class="card"><h2>Tablet</h2><p>₹18000</p></div>
    <div class="card"><h2>Speaker</h2><p>₹3000</p></div>
</div>

</body>
</html>
