<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #17324d;
            color: white;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 50px;
        }

        .about, .image {
            flex: 1;
            text-align: center;
        }

        .image img {
            width: 250px;
            height: 250px;
            object-fit: cover;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #17324d;
            color: white;
        }

        @media (max-width: 700px) {
            header, nav, main {
                flex-direction: column;
            }

            main {
                gap: 30px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Vansh</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="about">
        <h2>About Me</h2>
        <p>I am a student learning programming and web development.</p>
    </section>

    <section class="image">
        <img src="https://via.placeholder.com/250" alt="Profile Image">
    </section>
</main>

<footer>
    <p>© 2026 Vansh</p>
</footer>

</body>
</html>
